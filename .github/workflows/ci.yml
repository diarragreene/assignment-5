name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI spec and client
        run: ./generate-openapi.sh

      - name: Run tests
        run: npm run test

      - name: Upload generated client SDK
        uses: actions/upload-artifact@v4
        with:
          name: openapi-client-sdk
          path: ./client